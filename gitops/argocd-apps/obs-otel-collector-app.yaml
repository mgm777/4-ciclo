apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source: chart Helm oficial + values versionados neste repositório.
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.178.2
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/gitops/observability/values/otel-collector.yaml
    - repoURL: https://github.com/mgm777/4-ciclo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
