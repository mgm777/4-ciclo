apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-grafana-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Dashboard customizado + regras/contact points/política de alerta (como código)
  source:
    repoURL: https://github.com/mgm777/4-ciclo.git
    targetRevision: main
    path: gitops/observability/config
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
