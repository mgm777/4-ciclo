apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source: chart Helm oficial + values versionados neste repositório.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/gitops/observability/values/loki.yaml
    - repoURL: https://github.com/mgm777/4-ciclo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
