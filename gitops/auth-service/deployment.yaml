apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service-ksa
      containers:
        - name: auth-service
          image: us-central1-docker.pkg.dev/fiap-4-514223/auth-service/auth-service:v1.0.0-6952351
          ports:
            - containerPort: 8001
          env:
            # --- OpenTelemetry: identidade do serviço e atributos de recurso ---
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=togglemaster,k8s.deployment.name=auth-service,deployment.environment.name=production"
            # Habilita o endpoint /admin/chaos (injeção de falha da demonstração)
            - name: CHAOS_ENABLED
              value: "true"
            - name: PORT
              value: "8001"
          envFrom:
            # Configuração OTLP comum (endpoint do OTel Collector etc.)
            - configMapRef:
                name: togglemaster-otel
            - secretRef:
                name: auth-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
