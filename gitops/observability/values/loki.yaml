# Loki em modo SingleBinary com storage em disco (PVC) — suficiente para o
# volume do ToggleMaster e bem mais barato que o modo distribuído com bucket.
# Os logs chegam do OTel Collector pelo endpoint OTLP nativo (/otlp); os
# atributos de recurso (service.name, k8s.namespace.name, k8s.pod.name...)
# viram labels: service_name, k8s_namespace_name, k8s_pod_name...
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Modo distribuído / simple scalable desligado
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
